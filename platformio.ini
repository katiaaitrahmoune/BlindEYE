; PlatformIO Project Configuration File
; Minimal test env: WiFi + custom I2S WAV streaming (no external audio library, no PSRAM needed)

[env:esp32s3_audio_test]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; upload_port = COM3
; monitor_port = COM3

board_build.partitions = huge_app.csv
; No PSRAM needed for this approach

build_flags = 
    -DCORE_DEBUG_LEVEL=3