; PlatformIO Project Configuration File
;
; Switched to the pioarduino platform fork -- the official "espressif32"
; platform ships an older Arduino-ESP32 core with an outdated TLS stack that
; fails to complete HTTPS handshakes with some modern servers (like ngrok's
; edge), even though plain HTTP and other TLS servers work fine. This is the
; same fix already applied to the ESP32-S3 board's project.

[env:ttgo_t_camera]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp-wrover-kit
framework = arduino
board_build.partitions = huge_app.csv
board_build.psram = enabled
monitor_speed = 115200
upload_port = COM4
monitor_port = COM4
upload_speed = 921600
build_flags = 
    -DBOARD_HAS_PSRAM
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH

lib_deps = 
    adafruit/Adafruit SSD1306@^2.5.15
    bblanchon/ArduinoJson@^6.21.2